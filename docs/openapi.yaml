openapi: 3.1.0
info:
  title: p2p-crm API
  version: 0.1.0
servers:
  - url: /api/v1
security:
  - sessionCookie: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: p2p_crm_session
      description: Server-side session token. Cookie is httpOnly, SameSite=Lax, Secure outside local development.
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, DOMAIN_ERROR]
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
            details:
              type: array
              items:
                type: string
    User:
      type: object
      required: [id, teamId, role, login, status]
      properties:
        id: { type: integer, format: int64 }
        teamId: { type: integer, format: int64 }
        role: { type: string, enum: [teamlead, trader] }
        login: { type: string }
        status: { type: string, enum: [active, disabled, deleted] }
    Trader:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [salaryRateBps, externalWorkerName, createdAt, updatedAt]
          properties:
            salaryRateBps: { type: integer, format: int64 }
            externalWorkerName: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    AuthResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/User" }
    TradersListResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Trader" }
        page: { type: integer, format: int64 }
        pageSize: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
    TraderResponse:
      type: object
      required: [trader]
      properties:
        trader: { $ref: "#/components/schemas/Trader" }
    TraderProfile:
      type: object
      required: [id, login, salaryRateBps, externalWorkerName, currentShiftSuccessInboundMinor, currentShiftSalaryMinor, periodSuccessInboundMinor, periodSalaryMinor]
      properties:
        id: { type: integer, format: int64 }
        login: { type: string }
        salaryRateBps: { type: integer, format: int64 }
        externalWorkerName: { type: string }
        currentShiftSuccessInboundMinor: { type: integer, format: int64 }
        currentShiftSalaryMinor: { type: integer, format: int64 }
        periodId: { type: integer, format: int64 }
        periodTitle: { type: string }
        periodSuccessInboundMinor: { type: integer, format: int64 }
        periodSalaryMinor: { type: integer, format: int64 }
    TraderProfileResponse:
      type: object
      required: [profile]
      properties:
        profile: { $ref: "#/components/schemas/TraderProfile" }
    ResetTraderPasswordResponse:
      type: object
      required: [trader, temporaryPassword]
      properties:
        trader: { $ref: "#/components/schemas/Trader" }
        temporaryPassword:
          type: string
          description: Temporary password returned only once. It must not be logged or stored by clients.
    Bank:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    BanksListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Bank" }
    Requisite:
      type: object
      required: [id, teamId, phone, methodType, bankCode, bankName, status, targetTurnoverMinor, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        teamId: { type: integer, format: int64 }
        phone: { type: string }
        methodType: { type: string }
        bankCode: { type: string }
        bankName: { type: string }
        proxy: { type: string }
        employeeComment: { type: string }
        holderName: { type: string }
        cardNumber: { type: string }
        detailsFilledAt: { type: string, format: date-time }
        detailsFilledBy: { type: integer, format: int64 }
        status: { type: string, enum: [active, disabled, archived] }
        assignedTraderId: { type: integer, format: int64 }
        assignedTraderLogin: { type: string }
        assignmentStatus: { type: string, enum: [planned, assigned, in_work, worked, blocked, cancelled, expired] }
        assignedForDate: { type: string, format: date-time }
        targetTurnoverMinor: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RequisiteAssignment:
      type: object
      required: [id, teamId, requisiteId, traderId, assignedBy, assignedAt, status, assignedForDate, targetTurnoverMinor, wasReassign]
      properties:
        id: { type: integer, format: int64 }
        teamId: { type: integer, format: int64 }
        requisiteId: { type: integer, format: int64 }
        traderId: { type: integer, format: int64 }
        assignedBy: { type: integer, format: int64 }
        assignedAt: { type: string, format: date-time }
        unassignedAt: { type: string, format: date-time }
        comment: { type: string }
        status: { type: string, enum: [planned, assigned, in_work, worked, blocked, cancelled, expired] }
        assignedForDate: { type: string, format: date-time }
        targetTurnoverMinor: { type: integer, format: int64, minimum: 0 }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time }
        shiftRequisiteId: { type: integer, format: int64 }
        wasReassign: { type: boolean }
    RequisiteAssignmentWorkRow:
      type: object
      required:
        [
          assignmentId,
          teamId,
          requisiteId,
          phone,
          bankCode,
          bankName,
          traderId,
          traderLogin,
          status,
          assignedForDate,
          targetTurnoverMinor,
          inboundTurnoverMinor,
          outboundTurnoverMinor,
          closingBalanceMinor,
          assignedAt,
          updatedAt,
        ]
      properties:
        assignmentId: { type: integer, format: int64 }
        teamId: { type: integer, format: int64 }
        requisiteId: { type: integer, format: int64 }
        phone: { type: string }
        bankCode: { type: string }
        bankName: { type: string }
        proxy: { type: string }
        traderId: { type: integer, format: int64 }
        traderLogin: { type: string }
        status: { type: string, enum: [planned, assigned, in_work, worked, blocked, cancelled, expired] }
        assignedForDate: { type: string, format: date-time }
        targetTurnoverMinor: { type: integer, format: int64, minimum: 0 }
        inboundTurnoverMinor: { type: integer, format: int64 }
        outboundTurnoverMinor: { type: integer, format: int64 }
        closingBalanceMinor: { type: integer, format: int64, minimum: 0 }
        cardNumber: { type: string }
        holderName: { type: string }
        takenAt: { type: string, format: date-time }
        releasedAt: { type: string, format: date-time }
        comment: { type: string }
        assignedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        shiftRequisiteId: { type: integer, format: int64 }
    RequisiteReportSummary:
      type: object
      required:
        [
          id,
          teamId,
          phone,
          methodType,
          bankCode,
          bankName,
          status,
          totalInboundTurnoverMinor,
          totalOutboundTurnoverMinor,
          lastClosingBalanceMinor,
          latestStatus,
        ]
      properties:
        id: { type: integer, format: int64 }
        teamId: { type: integer, format: int64 }
        phone: { type: string }
        methodType: { type: string }
        bankCode: { type: string }
        bankName: { type: string }
        proxy: { type: string }
        employeeComment: { type: string }
        holderName: { type: string }
        cardNumber: { type: string }
        status: { type: string, enum: [active, disabled, archived] }
        totalInboundTurnoverMinor: { type: integer, format: int64 }
        totalOutboundTurnoverMinor: { type: integer, format: int64 }
        lastClosingBalanceMinor: { type: integer, format: int64, minimum: 0 }
        latestStatus: { type: string }
        lastActivityAt: { type: string, format: date-time }
        lastShiftRequisiteId: { type: integer, format: int64 }
    RequisiteReportShift:
      type: object
      required:
        [
          shiftRequisiteId,
          shiftId,
          teamId,
          requisiteId,
          traderId,
          traderLogin,
          shiftStartedAt,
          shiftStatus,
          takenAt,
          requisiteStatus,
          inboundTurnoverMinor,
          outboundTurnoverMinor,
          targetTurnoverMinor,
          closingBalanceMinor,
          assignmentStatus,
        ]
      properties:
        shiftRequisiteId: { type: integer, format: int64 }
        shiftId: { type: integer, format: int64 }
        teamId: { type: integer, format: int64 }
        requisiteId: { type: integer, format: int64 }
        traderId: { type: integer, format: int64 }
        traderLogin: { type: string }
        shiftStartedAt: { type: string, format: date-time }
        shiftClosedAt: { type: string, format: date-time }
        shiftStatus: { type: string, enum: [open, closing, closed, closed_with_discrepancy] }
        takenAt: { type: string, format: date-time }
        releasedAt: { type: string, format: date-time }
        requisiteStatus: { type: string, enum: [active, worked, worked_pending_review, worked_verified, worked_discrepancy, correction, released, blocked] }
        inboundTurnoverMinor: { type: integer, format: int64 }
        outboundTurnoverMinor: { type: integer, format: int64 }
        targetTurnoverMinor: { type: integer, format: int64, minimum: 0 }
        closingBalanceMinor: { type: integer, format: int64, minimum: 0 }
        cardNumber: { type: string }
        holderName: { type: string }
        assignedForDate: { type: string, format: date-time }
        assignmentStatus: { type: string }
    RequisiteReport:
      type: object
      required: [summary, shifts]
      properties:
        summary: { $ref: "#/components/schemas/RequisiteReportSummary" }
        shifts:
          type: array
          items: { $ref: "#/components/schemas/RequisiteReportShift" }
    RequisiteAssignmentEvent:
      type: object
      required: [id, teamId, assignmentId, actorId, action, createdAt]
      properties:
        id: { type: integer, format: int64 }
        teamId: { type: integer, format: int64 }
        assignmentId: { type: integer, format: int64 }
        actorId: { type: integer, format: int64 }
        action: { type: string }
        beforeJson:
          type: object
          additionalProperties: true
        afterJson:
          type: object
          additionalProperties: true
        comment: { type: string }
        createdAt: { type: string, format: date-time }
    PlanRequisiteRequest:
      type: object
      required: [requisiteId, traderId, assignedForDate, targetTurnoverMinor]
      properties:
        requisiteId: { type: integer, format: int64 }
        traderId: { type: integer, format: int64 }
        assignedForDate: { type: string, format: date }
        targetTurnoverMinor: { type: integer, format: int64, minimum: 0 }
        comment: { type: string }
    RequisitesListResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Requisite" }
        page: { type: integer, format: int64 }
        pageSize: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
    RequisiteResponse:
      type: object
      required: [requisite]
      properties:
        requisite: { $ref: "#/components/schemas/Requisite" }
    AssignmentResponse:
      type: object
      required: [assignment]
      properties:
        assignment: { $ref: "#/components/schemas/RequisiteAssignment" }
    AssignmentHistoryResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RequisiteAssignment" }
        page: { type: integer, format: int64 }
        pageSize: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
    AssignmentRowsResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RequisiteAssignmentWorkRow" }
        page: { type: integer, format: int64 }
        pageSize: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
    RequisiteReportResponse:
      type: object
      required: [report]
      properties:
        report: { $ref: "#/components/schemas/RequisiteReport" }
    AssignmentEventsResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RequisiteAssignmentEvent" }
        page: { type: integer, format: int64 }
        pageSize: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
    Shift:
      type: object
      required: [id, teamId, traderId, startedAt, status, inboundReconciliationStatus, outboundReconciliationStatus, tlReconciliationStatus, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        teamId: { type: integer, format: int64 }
        traderId: { type: integer, format: int64 }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        status: { type: string, enum: [open, closing, closed, closed_with_discrepancy] }
        inboundReconciliationStatus: { type: string }
        outboundReconciliationStatus: { type: string }
        tlReconciliationStatus: { type: string, enum: [not_checked, confirmed_by_tl, updated_by_tl, tl_discrepancy, tl_accepted] }
        lastTeamleadReconciliationId: { type: integer, format: int64 }
        tlReconciledAt: { type: string, format: date-time }
        closeComment: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
    CurrentShiftResponse:
      type: object
      properties:
        shift: { $ref: "#/components/schemas/Shift" }
    ShiftHistoryResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Shift" }
        page: { type: integer, format: int64 }
        pageSize: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
    CloseShiftResponse:
      type: object
      required: [shift]
      properties:
        shift: { $ref: "#/components/schemas/Shift" }
    AssignedRequisite:
      type: object
      required:
        [
          id,
          teamId,
          phone,
          methodType,
          bankCode,
          bankName,
          status,
          assignmentId,
          assignmentStatus,
          assignedForDate,
          targetTurnoverMinor,
          inboundTurnoverMinor,
          outboundTurnoverMinor,
          closingBalanceMinor,
          inWork,
        ]
      properties:
        id: { type: integer, format: int64 }
        teamId: { type: integer, format: int64 }
        phone: { type: string }
        methodType: { type: string }
        bankCode: { type: string }
        bankName: { type: string }
        proxy: { type: string }
        employeeComment: { type: string }
        status: { type: string, enum: [active, disabled, archived, blocked] }
        assignmentId: { type: integer, format: int64 }
        assignmentStatus: { type: string, enum: [planned, assigned, in_work, worked, blocked, cancelled, expired] }
        assignedForDate: { type: string, format: date-time }
        targetTurnoverMinor: { type: integer, format: int64, minimum: 0 }
        shiftRequisiteId: { type: integer, format: int64 }
        cardNumber: { type: string }
        holderName: { type: string }
        shiftRequisiteStatus: { type: string, enum: [active, worked, worked_pending_review, worked_verified, worked_discrepancy, correction, released, blocked] }
        takenAt: { type: string, format: date-time }
        releasedAt: { type: string, format: date-time }
        inboundTurnoverMinor: { type: integer, format: int64 }
        outboundTurnoverMinor: { type: integer, format: int64 }
        closingBalanceMinor: { type: integer, format: int64, minimum: 0 }
        inWork: { type: boolean }
    AssignedRequisitesResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AssignedRequisite" }
        page: { type: integer, format: int64 }
        pageSize: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
    ShiftRequisite:
      type: object
      required: [id, teamId, shiftId, traderId, requisiteId, cardNumber, holderName, takenAt, status, inboundTurnoverMinor, outboundTurnoverMinor, closingBalanceMinor, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        teamId: { type: integer, format: int64 }
        shiftId: { type: integer, format: int64 }
        traderId: { type: integer, format: int64 }
        requisiteId: { type: integer, format: int64 }
        assignmentId: { type: integer, format: int64 }
        cardNumber: { type: string }
        holderName: { type: string }
        takenAt: { type: string, format: date-time }
        releasedAt: { type: string, format: date-time }
        status: { type: string, enum: [active, worked, worked_pending_review, worked_verified, worked_discrepancy, correction, released, blocked] }
        inboundTurnoverMinor: { type: integer, format: int64 }
        outboundTurnoverMinor: { type: integer, format: int64 }
        closingBalanceMinor: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ShiftRequisitesResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ShiftRequisite" }
        page: { type: integer, format: int64 }
        pageSize: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
    TakeRequisiteResponse:
      type: object
      required: [shift, shiftRequisite, shiftCreated]
      properties:
        shift: { $ref: "#/components/schemas/Shift" }
        shiftRequisite: { $ref: "#/components/schemas/ShiftRequisite" }
        shiftCreated: { type: boolean }
    ShiftRequisiteResponse:
      type: object
      required: [shiftRequisite]
      properties:
        shiftRequisite: { $ref: "#/components/schemas/ShiftRequisite" }
    TurnoverEntry:
      type: object
      required: [id, teamId, shiftId, shiftRequisiteId, requisiteId, traderId, amountMinor, createdBy, createdAt]
      properties:
        id: { type: integer, format: int64 }
        teamId: { type: integer, format: int64 }
        shiftId: { type: integer, format: int64 }
        shiftRequisiteId: { type: integer, format: int64 }
        requisiteId: { type: integer, format: int64 }
        traderId: { type: integer, format: int64 }
        amountMinor: { type: integer, format: int64 }
        createdBy: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        comment: { type: string }
    TurnoversResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TurnoverEntry" }
    TurnoversListResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TurnoverEntry" }
        page: { type: integer, format: int64 }
        pageSize: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
    TurnoverResponse:
      type: object
      required: [turnover]
      properties:
        turnover: { $ref: "#/components/schemas/TurnoverEntry" }
    CloseShiftRequisiteRequest:
      type: object
      required: [inboundTurnoverMinor, outboundTurnoverMinor, closingBalanceMinor, blocked]
      properties:
        inboundTurnoverMinor: { type: integer, format: int64, minimum: 0 }
        outboundTurnoverMinor: { type: integer, format: int64, minimum: 0 }
        closingBalanceMinor: { type: integer, format: int64, minimum: 0 }
        releasedAt: { type: string, format: date-time }
        blocked: { type: boolean }
        comment: { type: string }
    CorrectShiftRequisiteRequest:
      type: object
      required: [inboundTurnoverMinor, outboundTurnoverMinor, closingBalanceMinor, comment]
      properties:
        inboundTurnoverMinor: { type: integer, format: int64, minimum: 0 }
        outboundTurnoverMinor: { type: integer, format: int64, minimum: 0 }
        closingBalanceMinor: { type: integer, format: int64, minimum: 0 }
        comment: { type: string, minLength: 1 }
    CreateInternalTransferRequest:
      type: object
      required: [sourceShiftRequisiteId, destinationShiftRequisiteId, amountMinor]
      properties:
        sourceShiftRequisiteId: { type: integer, format: int64 }
        destinationShiftRequisiteId: { type: integer, format: int64 }
        amountMinor: { type: integer, format: int64, minimum: 1 }
        comment: { type: string }
    CloseChecklist:
      type: object
      required: [shift, inboundImported, inboundOk, outboundImported, outboundOk, allRequisitesClosed, openRequisiteCount, allPayoutsFullyPaid, unpaidPayoutCount, canClose]
      properties:
        shift: { $ref: "#/components/schemas/Shift" }
        inboundImported: { type: boolean }
        inboundOk: { type: boolean }
        outboundImported: { type: boolean }
        outboundOk: { type: boolean }
        allRequisitesClosed: { type: boolean }
        openRequisiteCount: { type: integer, format: int64 }
        allPayoutsFullyPaid: { type: boolean }
        unpaidPayoutCount: { type: integer, format: int64 }
        canClose: { type: boolean }
    ChecklistResponse:
      type: object
      required: [checklist]
      properties:
        checklist: { $ref: "#/components/schemas/CloseChecklist" }
    Payout:
      type: object
      required: [id, teamId, shiftId, traderId, destinationBank, destinationRequisite, amountMinor, paidAmountMinor, remainingAmountMinor, status, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        teamId: { type: integer, format: int64 }
        shiftId: { type: integer, format: int64 }
        traderId: { type: integer, format: int64 }
        destinationBank: { type: string }
        destinationRequisite: { type: string }
        amountMinor: { type: integer, format: int64 }
        paidAmountMinor: { type: integer, format: int64 }
        remainingAmountMinor: { type: integer, format: int64 }
        status: { type: string, enum: [draft, in_progress, paid, cancelled] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time }
    PayoutTransfer:
      type: object
      required: [id, teamId, manualPayoutOrderId, shiftId, traderId, sourceShiftRequisiteId, sourceRequisiteId, amountMinor, createdBy, createdAt]
      properties:
        id: { type: integer, format: int64 }
        teamId: { type: integer, format: int64 }
        manualPayoutOrderId: { type: integer, format: int64 }
        shiftId: { type: integer, format: int64 }
        traderId: { type: integer, format: int64 }
        sourceShiftRequisiteId: { type: integer, format: int64 }
        sourceRequisiteId: { type: integer, format: int64 }
        sourcePhone: { type: string }
        sourceBankName: { type: string }
        amountMinor: { type: integer, format: int64 }
        createdBy: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        comment: { type: string }
    InternalTransfer:
      type: object
      required: [id, teamId, shiftId, traderId, sourceShiftRequisiteId, sourceRequisiteId, sourcePhone, sourceBankCode, sourceBankName, destinationShiftRequisiteId, destinationRequisiteId, destinationPhone, destinationBankCode, destinationBankName, amountMinor, status, createdBy, createdAt]
      properties:
        id: { type: integer, format: int64 }
        teamId: { type: integer, format: int64 }
        shiftId: { type: integer, format: int64 }
        traderId: { type: integer, format: int64 }
        sourceShiftRequisiteId: { type: integer, format: int64 }
        sourceRequisiteId: { type: integer, format: int64 }
        sourcePhone: { type: string }
        sourceBankCode: { type: string }
        sourceBankName: { type: string }
        destinationShiftRequisiteId: { type: integer, format: int64 }
        destinationRequisiteId: { type: integer, format: int64 }
        destinationPhone: { type: string }
        destinationBankCode: { type: string }
        destinationBankName: { type: string }
        amountMinor: { type: integer, format: int64 }
        status: { type: string, enum: [active, cancelled] }
        createdBy: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        cancelledBy: { type: integer, format: int64 }
        cancelledAt: { type: string, format: date-time }
        comment: { type: string }
