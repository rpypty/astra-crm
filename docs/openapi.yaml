  parameters:
    OrderDateFrom:
      name: dateFrom
      in: query
      required: false
      schema: { type: string, format: date }
    OrderDateTo:
      name: dateTo
      in: query
      required: false
      schema: { type: string, format: date }
    OrderStatus:
      name: status
      in: query
      required: false
      schema: { type: string }
    OrderTraderId:
      name: traderId
      in: query
      required: false
      schema: { type: integer, format: int64 }
      description: Legacy single-trader filter.
    OrderTraderIds:
      name: traderIds
      in: query
      required: false
      schema:
        type: string
        pattern: "^\\d+(,\\d+)*$"
      description: Comma-separated trader ids, for example `1,2,3`.
    RequisiteAvailableForPlanning:
      name: availableForPlanning
      in: query
      required: false
      schema: { type: boolean, default: false }
      description: Return only active requisites available as planning candidates.
    RequisiteSearch:
      name: search
      in: query
      required: false
      schema: { type: string }
      description: Search by phone, bank, proxy, holder, card, comment, or trader login where available.
    RequisiteBankCode:
      name: bankCode
      in: query
      required: false
      schema: { type: string }
    RequisiteStatus:
      name: status
      in: query
      required: false
      schema: { type: string, enum: [active, archived, all] }
      description: Requisite status filter.
    RequisiteTraderId:
      name: traderId
      in: query
      required: false
      schema: { type: string }
      description: Trader id, `all`, or `unassigned` where applicable.
    TraderRequisiteStatuses:
      name: statuses
      in: query
      required: false
      schema: { type: string }
      description: Comma-separated frontend requisite statuses, for example `in_work,correction`.
    TraderRequisiteSearch:
      name: search
      in: query
      required: false
      schema: { type: string }
      description: Search by phone, bank name, or card number.
    TraderRequisiteExcludeId:
      name: excludeId
      in: query
      required: false
      schema: { type: integer, format: int64 }
      description: Shift requisite id to exclude from lookup results.
    PayoutStatus:
      name: status
      in: query
      required: false
      schema: { type: string, enum: [open, draft, in_progress, paid, cancelled, all] }
    ReconciliationItemStatus:
      name: status
      in: query
      required: false
      schema: { type: string, enum: [mismatch, all] }
    ReconciliationOnlyMismatch:
      name: onlyMismatch
      in: query
      required: false
      schema: { type: boolean, default: false }
    TeamleadReconciliationDirection:
      name: direction
      in: query
      required: false
      schema: { type: string, enum: [inbound, outbound, all] }
    TeamleadReconciliationStage:
      name: stage
      in: query
      required: false
      schema: { type: string }
    TeamleadReconciliationIssueType:
      name: issueType
      in: query
      required: false
      schema: { type: string }
    TeamleadReconciliationSeverity:
      name: severity
      in: query
      required: false
      schema: { type: string, enum: [info, warning, error, blocker, all] }
    TeamleadReconciliationTraderId:
      name: traderId
      in: query
      required: false
      schema: { type: integer, format: int64 }
    TeamleadReconciliationRequisiteId:
      name: requisiteId
      in: query
      required: false
      schema: { type: integer, format: int64 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 1, maximum: 200, default: 50 }
  responses:
    Error:
      description: API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
paths:
  /auth/login:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Login result and Set-Cookie session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        default: { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      responses:
        "200":
          description: Session revoked and cookie cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        default: { $ref: "#/components/responses/Error" }
  /auth/me:
    get:
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        default: { $ref: "#/components/responses/Error" }
  /banks:
    get:
      responses:
        "200":
          description: Active bank dictionary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BanksListResponse" }
        default: { $ref: "#/components/responses/Error" }
  /teamlead/traders:
    get:
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Traders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradersListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password, salaryRateBps, externalWorkerName]
              properties:
                login: { type: string }
                password: { type: string, format: password }
                salaryRateBps: { type: integer, format: int64 }
                externalWorkerName: { type: string }
      responses:
        "201":
          description: Trader created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TraderResponse" }
        default: { $ref: "#/components/responses/Error" }
  /teamlead/traders/{traderId}:
    parameters:
      - name: traderId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      responses:
        "200":
          description: Trader
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TraderResponse" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      responses:
        "200":
          description: Trader updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TraderResponse" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      responses:
        "200":
          description: Trader disabled/deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        default: { $ref: "#/components/responses/Error" }
  /teamlead/traders/{traderId}/reset-password:
    post:
      parameters:
        - name: traderId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Temporary password returned once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResetTraderPasswordResponse" }
        default: { $ref: "#/components/responses/Error" }
  /teamlead/requisites:
    get:
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/RequisiteSearch"
        - $ref: "#/components/parameters/RequisiteBankCode"
        - $ref: "#/components/parameters/RequisiteStatus"
        - $ref: "#/components/parameters/RequisiteTraderId"
        - $ref: "#/components/parameters/RequisiteAvailableForPlanning"
      responses:
        "200":
          description: Requisites
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequisitesListResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      responses:
        "201":
