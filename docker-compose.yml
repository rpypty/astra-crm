x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

x-database-env: &database-env
  DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@${POSTGRES_HOST:?POSTGRES_HOST is required}:${POSTGRES_INTERNAL_PORT:?POSTGRES_INTERNAL_PORT is required}/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=${POSTGRES_SSLMODE:?POSTGRES_SSLMODE is required}

x-backend-env: &backend-env
  <<: *database-env
  APP_ENV: ${APP_ENV:?APP_ENV is required}
  HTTP_ADDR: ${HTTP_ADDR:?HTTP_ADDR is required}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:?SESSION_COOKIE_NAME is required}
  SESSION_SECURE: ${SESSION_SECURE:?SESSION_SECURE is required}
  CSRF_ALLOWED_ORIGINS: ${CSRF_ALLOWED_ORIGINS:?CSRF_ALLOWED_ORIGINS is required}
  LOGIN_RATE_LIMIT_REQUESTS: ${LOGIN_RATE_LIMIT_REQUESTS:?LOGIN_RATE_LIMIT_REQUESTS is required}
  LOGIN_RATE_LIMIT_WINDOW: ${LOGIN_RATE_LIMIT_WINDOW:?LOGIN_RATE_LIMIT_WINDOW is required}

x-frontend-env: &frontend-env
  VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
  VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:?VITE_API_PROXY_TARGET is required}
  VITE_DEMO_ACCOUNTING_PERIOD_ID: ${VITE_DEMO_ACCOUNTING_PERIOD_ID:?VITE_DEMO_ACCOUNTING_PERIOD_ID is required}

services:
  postgres:
    image: postgres:16-alpine
    environment: *postgres-env
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./astra-crm-backend
    command: ["/app/migrate"]
    environment:
      <<: *database-env
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: ./astra-crm-backend
    command: ["/app/seed"]
    environment: *database-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build:
      context: ./astra-crm-backend
    environment: *backend-env
    ports:
      - "${BACKEND_PORT:?BACKEND_PORT is required}:8080"
    depends_on:
      seed:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./astra-crm-frontend
      target: dev
    environment: *frontend-env
    ports:
      - "${FRONTEND_PORT:?FRONTEND_PORT is required}:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
