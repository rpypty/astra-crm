name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astra-crm-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: astra-crm-backend/go.mod
          cache-dependency-path: astra-crm-backend/go.sum

      - name: Test
        run: go test ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astra-crm-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astra-crm-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check OpenAPI generated types
        run: npm run openapi:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t astra-crm-backend:ci-${{ github.sha }} ./astra-crm-backend

      - name: Build frontend image
        run: |
          docker build \
            -f deploy/Dockerfile.frontend \
            --build-arg VITE_API_BASE_URL=/api/v1 \
            -t astra-crm-frontend:ci-${{ github.sha }} \
            .
