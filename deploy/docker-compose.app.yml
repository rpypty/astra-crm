services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app

  migrate:
    image: ${BACKEND_IMAGE}
    command: ["/app/migrate"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
      HTTP_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      SESSION_SECURE: ${SESSION_SECURE}
      CSRF_ALLOWED_ORIGINS: ${CSRF_ALLOWED_ORIGINS}
      LOGIN_RATE_LIMIT_REQUESTS: ${LOGIN_RATE_LIMIT_REQUESTS}
      LOGIN_RATE_LIMIT_WINDOW: ${LOGIN_RATE_LIMIT_WINDOW}
    ports:
      - "127.0.0.1:${HOST_BACKEND_PORT}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_FRONTEND_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app

networks:
  app:
    name: ${COMPOSE_PROJECT_NAME}_network

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME}_postgres_data
